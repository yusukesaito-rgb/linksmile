<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
</style>
</helmet>
<div style="font-family:'Zen Kaku Gothic New',sans-serif;background:#FAF6F0;color:#3D372C;min-height:100vh;line-height:1.9;">
  <header style="padding:26px 44px;border-bottom:1px solid #FFE8D6;background:#fff;">
    <div style="max-width:820px;margin:0 auto;display:flex;align-items:center;gap:10px;">
      <span style="width:7px;height:7px;border-radius:50%;background:#FFB789;display:inline-block;"></span>
      <span style="font-family:'Jost',sans-serif;font-weight:300;font-size:20px;letter-spacing:.12em;">Link & Smile</span>
    </div>
  </header>

  <div style="max-width:820px;margin:0 auto;padding:68px 44px 100px;">
    <div style="font-family:'Jost';font-size:12px;letter-spacing:.3em;color:#FFB789;margin-bottom:16px;">PRIVACY POLICY</div>
    <h1 style="font-size:30px;font-weight:700;letter-spacing:.04em;margin:0 0 24px;">プライバシーポリシー</h1>
    <p style="font-size:14.5px;line-height:2.05;color:#544c41;margin:0 0 40px;">Link&amp;Smile（以下、「当スタジオ」）は、お客様の個人情報の保護について、以下の通りプライバシーポリシーを定め、適切な管理に努めます。</p>

    <sc-for list="{{ sections }}" as="s" hint-placeholder-count="6">
      <section style="margin-bottom:38px;">
        <h2 style="font-size:17px;font-weight:700;letter-spacing:.03em;margin:0 0 14px;color:#3D372C;">{{ s.title }}</h2>
        <sc-if value="{{ s.body }}" hint-placeholder-val="{{ false }}">
          <p style="font-size:14.5px;line-height:2.05;color:#544c41;margin:0;">{{ s.body }}</p>
        </sc-if>
        <sc-if value="{{ s.list }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;flex-direction:column;gap:12px;margin-top:12px;">
            <sc-for list="{{ s.list }}" as="li" hint-placeholder-count="3">
              <div style="display:flex;gap:10px;font-size:14.5px;line-height:2.05;color:#544c41;">
                <span style="flex-shrink:0;color:#FFB789;">・</span>{{ li }}
              </div>
            </sc-for>
          </div>
        </sc-if>
      </section>
    </sc-for>

    <div style="margin-top:56px;padding-top:28px;border-top:1px solid #FFE8D6;">
      <a href="./Link & Smile LP.dc.html" style="font-size:13.5px;color:#C77A3E;text-decoration:none;">← トップページに戻る</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() {
    return {
      sections: [
        { title: '第1条（個人情報の収集）', body: '当スタジオは、レッスン予約、お問い合わせ、サービスお申し込み、および契約手続き等の際に、氏名、生年月日、住所、連絡先、健康状態など、サービスの提供に必要な範囲の個人情報を収集する場合があります。' },
        { title: '第2条（個人情報の利用目的）', body: '収集した個人情報は、以下の目的のためにのみ利用いたします。', list: [
          'サービスの提供、運営および管理（予約管理、レッスンの実施など）',
          'お客様への重要なお知らせ、ご案内、お問い合わせへの対応',
          '安全なトレーニング指導の実施および健康管理のため',
          'その他、上記に付随する目的',
        ] },
        { title: '第3条（個人情報の管理・保護）', body: '当スタジオは、お客様の個人情報を正確かつ最新の状態に保ち、個人情報への不正アクセス・紛失・破損・改ざん・漏洩などを防止するため、セキュリティシステムの維持等の必要な措置を講じ、厳重な管理を行います。' },
        { title: '第4条（個人情報の第三者提供）', body: '当スタジオは、次に掲げる場合を除いて、あらかじめお客様の同意を得ることなく、第三者に個人情報を提供することはありません。', list: [
          '法令に基づく場合',
          '人の生命、身体または財産の保護のために必要がある場合であって、本人の同意を得ることが困難であるとき',
          '国の機関もしくは地方公共団体またはその委託を受けた者が法令の定める事務を遂行することに対して協力する必要がある場合',
        ] },
        { title: '第5条（プライバシーポリシーの変更）', body: '本ポリシーの内容は、法令その他本ポリシーに別段の定めのある事項を除いて、お客様に通知することなく、変更することができるものとします。当スタジオが別途定める場合を除いて、変更後のプライバシーポリシーは、本ウェブサイトに掲載したときから効力を生じるものとします。' },
        { title: '第6条（お問い合わせ窓口）', body: '当スタジオの個人情報の取り扱いに関するお問い合わせは、ホームページのお問い合わせフォームよりご連絡ください。' },
      ],
    };
  }
}
</script>
</body>
</html>
