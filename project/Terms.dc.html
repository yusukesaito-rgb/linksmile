<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
</style>
</helmet>
<div style="font-family:'Zen Kaku Gothic New',sans-serif;background:#FAF6F0;color:#3D372C;min-height:100vh;line-height:1.9;">
  <header style="padding:26px 44px;border-bottom:1px solid #FFE8D6;background:#fff;">
    <div style="max-width:820px;margin:0 auto;display:flex;align-items:center;gap:10px;">
      <span style="width:7px;height:7px;border-radius:50%;background:#FFB789;display:inline-block;"></span>
      <span style="font-family:'Jost',sans-serif;font-weight:300;font-size:20px;letter-spacing:.12em;">Link & Smile</span>
    </div>
  </header>

  <div style="max-width:820px;margin:0 auto;padding:68px 44px 100px;">
    <div style="font-family:'Jost';font-size:12px;letter-spacing:.3em;color:#FFB789;margin-bottom:16px;">TERMS OF SERVICE</div>
    <h1 style="font-size:30px;font-weight:700;letter-spacing:.04em;margin:0 0 40px;">利用規約</h1>

    <sc-for list="{{ articles }}" as="a" hint-placeholder-count="6">
      <section style="margin-bottom:38px;">
        <h2 style="font-size:17px;font-weight:700;letter-spacing:.03em;margin:0 0 14px;color:#3D372C;">{{ a.title }}</h2>
        <sc-if value="{{ a.body }}" hint-placeholder-val="{{ false }}">
          <p style="font-size:14.5px;line-height:2.05;color:#544c41;margin:0;">{{ a.body }}</p>
        </sc-if>
        <sc-if value="{{ a.list }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;flex-direction:column;gap:12px;">
            <sc-for list="{{ a.list }}" as="li" hint-placeholder-count="3">
              <div style="display:flex;gap:10px;font-size:14.5px;line-height:2.05;color:#544c41;">
                <span style="flex-shrink:0;color:#FFB789;">・</span>{{ li }}
              </div>
            </sc-for>
          </div>
        </sc-if>
      </section>
    </sc-for>

    <div style="margin-top:56px;padding-top:28px;border-top:1px solid #FFE8D6;">
      <a href="./Link & Smile LP.dc.html" style="font-size:13.5px;color:#C77A3E;text-decoration:none;">← トップページに戻る</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() {
    return {
      articles: [
        { title: '第1条（適用）', body: 'Link&Smile（以下、「当スタジオ」）のサービスをご利用いただくにあたり、以下の利用規約をご確認いただき、同意の上でご利用ください。本規約は、当スタジオが提供するすべてのサービス（パーソナルトレーニング、グループセッション、その他関連するサービス）の利用に適用されます。お客様は、本規約のすべてに同意したものとみなされます。' },
        { title: '第2条（料金および解約について）', list: [
          '通常料金と継続プラン：各種プランの料金および支払方法は、当スタジオが定める料金表に従うものとします。',
          '3ヶ月・半年継続プランの途中解約に関する違約金（差額請求）：3ヶ月継続プラン、半年継続プランなどの割引適用プランにおいて、契約期間内にお客様のご都合により途中解約される場合、または規約違反等により契約解除となった場合は、契約期間中に適用されていた割引料金の総額と、通常料金（都度払いまたは単月料金）を適用した場合の総額との差額を直ちにお支払いいただきます。',
        ] },
        { title: '第3条（予約の変更・キャンセルについて）', list: [
          'キャンセルおよび変更の期限：ご予約の変更またはキャンセルされる場合は、【前日の21時まで】にご連絡をお願いいたします。期限内までのご連絡であれば、別の日にレッスンを振り替えて受講いただけます。',
          '当日キャンセルおよび無断キャンセル：期日を過ぎた場合の当日キャンセル、または無断キャンセルの場合は、「当該レッスンの消化（振替不可）」扱いとなりますので予めご了承ください。',
          '遅刻について：ご予約の時間に遅れる場合は、分かり次第速やかにご連絡ください。なお、後続のご予約状況等により、お時間を短縮してのトレーニングとなる場合がございます。',
        ] },
        { title: '第4条（健康管理・免責事項）', list: [
          '健康状態の事前申告と責任：お客様は、自身の健康状態が良好であり、医師等から運動を禁止されていないことを確認の上、トレーニングを受講するものとします。持病、怪我、手術歴、妊娠の可能性、または当日および直近の体調不良がある場合は、必ず事前にトレーナーへ申し出てください。虚偽の申告があった場合や、事前申告がないまま受講され、万が一怪我や体調の悪化などの不測の事態が生じた場合、当スタジオおよびトレーナーは一切の責任を負いかねます。',
          '貴重品・手荷物の管理：スタジオ内（ロッカールーム、シャワールーム等を含む）における現金、貴重品、その他手荷物の紛失、盗難、破損等について、当スタジオは一切の責任を負いかねます。貴重品はご自身で管理していただくようお願いいたします。',
          'ボディタッチ（身体的接触）への同意：当スタジオのトレーニングおよびコンディショニング指導において、正しいフォームの誘導、アライメントの修正、ストレッチ等の補助のために、トレーナーによる適切なボディタッチ（身体的接触）を伴う場合があります。お客様は、指導上これが不可欠であることをあらかじめ理解・了承した上で、トレーニングを受講するものとします。',
        ] },
        { title: '第5条（施設内での安全管理と禁止事項）', list: [
          '安全管理と事故の免責：スタジオ内ではトレーナーの指示に従い、安全に配慮してご利用ください。お客様の不注意や指示違反による怪我や事故について、当スタジオは責任を負いかねます。また、天災地変、設備の故障その他不可抗力による事故についても同様とします。',
          '禁止事項：他のお客様やトレーナーに対する迷惑行為、暴言、暴力、誹謗中傷、およびつきまとい等のハラスメント行為／施設内の器物破損や、許可なく他の利用者やトレーナーを撮影・録音する行為／その他、当スタジオの秩序を乱し、運営を妨げる一切の行為',
          '契約の解除（退会処分）：お客様が前項の禁止事項に違反した場合、または当スタジオの信用を傷つける行為があった場合、当スタジオは催告なしに直ちに契約を解除し、今後の利用をお断りできるものとします。この場合、受領済みの料金の返金は一切行いません。',
        ] },
        { title: '第6条（規約の変更）', body: '当スタジオは、必要に応じて本規約を改定できるものとし、改定後の規約はホームページ上に掲載した時点より効力を生じるものとします。' },
      ],
    };
  }
}
</script>
</body>
</html>
